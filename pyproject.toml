[project]
name = "kodi-donor-radio"
version = "0.1.0"
description = "Observable radio playback addon for Kodi"
requires-python = ">=3.8"
license = {text = "GPL-2.0-or-later"}

[project.optional-dependencies]
dev = ["pytest>=7,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
